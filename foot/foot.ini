# =============================================================================
#  ZENITH — FOOT TERMINAL CONFIGURATION
# =============================================================================
#  Ultra-lightweight Wayland terminal. Sub-2ms cold startup with foot --server.
# =============================================================================

# Include dynamic color palette extracted from wallpaper
include=~/.config/foot/colors.ini

font=JetBrainsMono Nerd Font:size=10
font-bold=JetBrainsMono Nerd Font:size=10:weight=bold
font-italic=JetBrainsMono Nerd Font:size=10:slant=italic
line-height=16
letter-spacing=0

pad=12x12
term=xterm-256color

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3.0

[bell]
urgent=no
notify=no
visual=no
