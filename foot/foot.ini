# =============================================================================
#  ZENITH — FOOT TERMINAL CONFIGURATION
# =============================================================================
#  Ultra-lightweight Wayland terminal. Sub-2ms cold startup with foot --server.
#  High-density compact layout: size=8.5, line-height=14, pad=8x8.
# =============================================================================

# Include dynamic color palette extracted from wallpaper
include=~/.config/foot/colors.ini

font=JetBrainsMono Nerd Font:size=8.5
font-bold=JetBrainsMono Nerd Font:size=8.5:weight=bold
font-italic=JetBrainsMono Nerd Font:size=8.5:slant=italic
line-height=14
letter-spacing=0

pad=8x8
term=xterm-256color

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3.0

[bell]
urgent=no
notify=no
visual=no
