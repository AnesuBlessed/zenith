# ╔══════════════════════════════════════════════════════╗
# ║          ZENITH — Hyprlock Lock Screen               ║
# ║  Rei-inspired: centred clock/date, always-visible     ║
# ║  password, wallpaper avatar, Zenith Display status.   ║
# ╚══════════════════════════════════════════════════════╝

# >>> ZENITH PALETTE
$accent   = rgb(199, 195, 255)
$base     = rgb(18, 18, 23)
$surface  = rgba(32, 32, 39, 0.75)
$border   = rgba(72, 70, 79, 0.35)
$text     = rgb(230, 225, 233)
$muted    = rgb(201, 197, 207)
$critical = rgb(255, 180, 171)
$popup    = rgba(42, 41, 49, 0.92)
# <<< ZENITH PALETTE

# ── Animations ───────────────────────────────────────────
animations {
  enabled = true
  bezier = zenith, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 4, zenith
  animation = inputFieldDots, 1, 2, zenith
}

# ── Background — blurred current wallpaper ───────────────
background {
  monitor =
  path = $HOME/.cache/zenith/wall.lock.png
  blur_passes = 2
  blur_size = 8
  brightness = 0.68
  contrast = 0.9
  vibrancy = 0.12
  vibrancy_darkness = 0.0
}

# ── Brand ────────────────────────────────────────────────
label {
  monitor =
  text = ZENITH
  color = $accent
  font_size = 18
  font_family = Zenith Display
  position = 0, -36
  halign = center
  valign = top
}

# ── TOP LEFT — Weather (Zenith Display) ──────────────────
label {
  monitor =
  text = cmd[update:120000] $HOME/.config/zenith/scripts/lock-status.sh weather
  color = $text
  font_size = 14
  font_family = Zenith Display
  position = 36, -32
  halign = left
  valign = top
}

# ── TOP RIGHT — WiFi  Battery (Zenith Display) ───────────
label {
  monitor =
  text = cmd[update:30000] $HOME/.config/zenith/scripts/lock-status.sh wifi
  color = $muted
  font_size = 13
  font_family = Zenith Display
  position = -220, -32
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:30000] $HOME/.config/zenith/scripts/lock-status.sh battery
  color = $text
  font_size = 13
  font_family = Zenith Display
  position = -36, -32
  halign = right
  valign = top
}

# ── CENTRE — Clock and date ──────────────────────────────
label {
  monitor =
  text = cmd[update:10000] date '+%H:%M'
  color = $text
  font_size = 112
  font_family = Zenith Display
  position = 0, 150
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date '+%A, %B %-d'
  color = $muted
  font_size = 22
  font_family = Zenith Display
  position = 0, 62
  halign = center
  valign = center
}

# ── CENTRE — Username ────────────────────────────────────
label {
  monitor =
  text =   $USER @ zenith
  color = $muted
  font_size = 14
  font_family = Zenith Display
  position = 0, 8
  halign = center
  valign = center
}

# ── CENTRE — Password pill (always visible) ──────────────
input-field {
  monitor =
  size = 320, 48
  outline_thickness = 2
  dots_size = 0.26
  dots_spacing = 0.18
  dots_center = true
  dots_rounding = -1
  outer_color = $accent
  inner_color = $surface
  font_color = $text
  fade_on_empty = false
  fade_timeout = 0
  placeholder_text = Password
  hide_input = false
  rounding = 14
  check_color = $accent
  fail_color = $critical
  fail_text = wrong password
  capslock_color = rgb(240, 180, 60)
  numlock_color = $accent
  bothlock_color = $critical
  invert_numlock = false
  position = 0, -62
  halign = center
  valign = center
}

# ── BOTTOM CENTRE — Now Playing ──────────────────────────
label {
  monitor =
  text = cmd[update:2000] $HOME/.config/zenith/scripts/lock-status.sh media
  color = $muted
  font_size = 12
  font_family = Zenith Display
  position = 0, 48
  halign = center
  valign = bottom
}
