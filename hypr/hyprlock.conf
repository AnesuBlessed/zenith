# ╔══════════════════════════════════════════════════════╗
# ║          ZENITH — Hyprlock Lock Screen               ║
# ║  Rich layout: clock, weather, battery, media,        ║
# ║  avatar, password field, Windows-style power popup   ║
# ╚══════════════════════════════════════════════════════╝

# >>> ZENITH PALETTE
$accent   = rgb(89, 185, 232)
$base     = rgba(10, 12, 18, 0.85)
$surface  = rgba(20, 24, 32, 0.75)
$border   = rgba(89, 185, 232, 0.35)
$text     = rgb(220, 230, 245)
$muted    = rgb(120, 135, 160)
$critical = rgb(240, 90, 90)
$popup    = rgba(14, 18, 28, 0.92)
# <<< ZENITH PALETTE

# ── Animations ───────────────────────────────────────────
animations {
  enabled = true
  bezier = zenith, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 4, zenith
  animation = inputFieldDots, 1, 2, zenith
}

# ── Background — blurred current wallpaper ───────────────
# Points at the pre-blurred image Zenith regenerates on every wallpaper
# transaction. A text state file renders as a black screen, so never
# reference current_wallpaper_image here.
background {
  monitor =
  path = $HOME/.cache/zenith/wall.lock.png
  blur_passes = 2
  blur_size = 8
  brightness = 0.7
  contrast = 0.9
  vibrancy = 0.15
  vibrancy_darkness = 0.0
}

# ── TOP LEFT — Weather ────────────────────────────────────
label {
  monitor =
  text = cmd[update:120000] $HOME/.config/zenith/scripts/lock-status.sh weather
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = 36, -32
  halign = left
  valign = top
}

# ── TOP RIGHT — WiFi  Battery ─────────────────────────────
label {
  monitor =
  text = cmd[update:30000] $HOME/.config/zenith/scripts/lock-status.sh wifi
  color = $muted
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  position = -120, -32
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:30000] $HOME/.config/zenith/scripts/lock-status.sh battery
  color = $text
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  position = -36, -32
  halign = right
  valign = top
}

# ── RIGHT COLUMN — Clock (Zenith Display, mock-style) ─────
# Content sits in a column at ~72% screen width so the wallpaper breathes
# on the left, like the design mock.
label {
  monitor =
  text = cmd[update:10000] date '+%H:%M'
  color = $text
  font_size = 104
  font_family = Zenith Display
  position = -330, 210
  halign = right
  valign = center
}

# Tiny AM/PM superscript riding the clock's right edge
label {
  monitor =
  text = cmd[update:10000] date '+%p'
  color = $muted
  font_size = 22
  font_family = Zenith Display
  position = -128, 282
  halign = right
  valign = center
}

# ── RIGHT COLUMN — Date ───────────────────────────────────
label {
  monitor =
  text = cmd[update:60000] date '+%A, %B %-d'
  color = $muted
  font_size = 20
  font_family = Zenith Display
  position = -330, 122
  halign = right
  valign = center
}

# ── RIGHT COLUMN — Password pill ──────────────────────────
input-field {
  monitor =
  size = 300, 46
  outline_thickness = 1
  dots_size = 0.26
  dots_spacing = 0.18
  dots_center = true
  dots_rounding = -1
  outer_color = $border
  inner_color = $surface
  font_color = $text
  fade_on_empty = true
  fade_timeout = 1200
  placeholder_text =  Password
  hide_input = false
  rounding = -1
  check_color = $accent
  fail_color = $critical
  fail_text = wrong password
  capslock_color = rgb(240, 180, 60)
  numlock_color = $accent
  bothlock_color = $critical
  invert_numlock = false
  position = -330, 52
  halign = right
  valign = center
}

# ── RIGHT COLUMN — Username ───────────────────────────────
label {
  monitor =
  text =   $USER @ zenith
  color = $muted
  font_size = 13
  font_family = Zenith Display
  position = -330, 8
  halign = right
  valign = center
}

# ── TOP LEFT — Brand mark (Zenith avatar, small) ──────────
image {
  monitor =
  path = $HOME/.cache/zenith/avatar.png
  size = 56
  position = 40, -76
  halign = left
  valign = top
}

# ── CENTER BELOW — Now Playing (collapses when nothing) ───
label {
  monitor =
  text = cmd[update:2000] $HOME/.config/zenith/scripts/lock-status.sh media
  color = $muted
  font_size = 11
  font_family = JetBrainsMono Nerd Font Italic
  position = -330, -40
  halign = right
  valign = center
}

# ══════════════════════════════════════════════════════════
#  POWER POPUP — Windows-style (press button → options pop)
# ══════════════════════════════════════════════════════════

# Power button (always visible, bottom-right). The glyph-based icon kept
# failing in hyprlock's font stack, so the visual is a generated PNG while
# the label stays underneath purely as the click target.
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label power
  color = $text
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  position = -46, 44
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh toggle
}

image {
  monitor =
  path = $HOME/.cache/zenith/power.png
  size = 44
  position = -46, 44
  halign = right
  valign = bottom
}

# Suspend action (appears above power button when open)
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label suspend
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = -46, 104
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh action suspend
}

# Reboot action
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label reboot
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = -46, 134
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh action reboot
}

# Shutdown action
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label shutdown
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = -46, 164
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh action shutdown
}

# Cancel action
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label cancel
  color = $muted
  font_size = 11
  font_family = JetBrainsMono Nerd Font
  position = -46, 84
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh cancel
}