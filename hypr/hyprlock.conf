# ╔══════════════════════════════════════════════════════╗
# ║          ZENITH — Hyprlock Lock Screen               ║
# ║  Rich layout: clock, weather, battery, media,        ║
# ║  avatar, password field, Windows-style power popup   ║
# ╚══════════════════════════════════════════════════════╝

$accent   = rgb(89, 185, 232)
$base     = rgba(10, 12, 18, 0.85)
$surface  = rgba(20, 24, 32, 0.75)
$border   = rgba(89, 185, 232, 0.35)
$text     = rgb(220, 230, 245)
$muted    = rgb(120, 135, 160)
$critical = rgb(240, 90, 90)
$popup    = rgba(14, 18, 28, 0.92)

# ── Animations ───────────────────────────────────────────
animations {
  enabled = true
  bezier = zenith, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 4, zenith
  animation = inputFieldDots, 1, 2, zenith
}

# ── Background — blurred current wallpaper ───────────────
background {
  monitor =
  path = $HOME/.local/state/zenith/current_wallpaper
  blur_passes = 3
  blur_size = 8
  brightness = 0.6
  contrast = 0.9
  vibrancy = 0.15
  vibrancy_darkness = 0.0
}

# ── TOP LEFT — Weather ────────────────────────────────────
label {
  monitor =
  text = cmd[update:120000] $HOME/.config/zenith/scripts/lock-status.sh weather
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = 36, -32
  halign = left
  valign = top
}

# ── TOP RIGHT — WiFi  Battery ─────────────────────────────
label {
  monitor =
  text = cmd[update:30000] $HOME/.config/zenith/scripts/lock-status.sh wifi
  color = $muted
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  position = -120, -32
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:30000] $HOME/.config/zenith/scripts/lock-status.sh battery
  color = $text
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  position = -36, -32
  halign = right
  valign = top
}

# ── CENTER — Clock ────────────────────────────────────────
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 72
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, 240
  halign = center
  valign = center
}

# ── CENTER — Date ─────────────────────────────────────────
label {
  monitor =
  text = cmd[update:60000] date '+%A, %B %-d'
  color = $muted
  font_size = 14
  font_family = JetBrainsMono Nerd Font
  position = 0, 174
  halign = center
  valign = center
}

# ── CENTER — Avatar (circular via shape) ──────────────────
shape {
  monitor =
  size = 88, 88
  color = $border
  rounding = -1
  border_size = 2
  border_color = $accent
  position = 0, 92
  halign = center
  valign = center
  zindex = 1
}

image {
  monitor =
  path = $HOME/.config/zenith/assets/avatar.png
  size = 84
  rounding = -1
  position = 0, 92
  halign = center
  valign = center
  zindex = 2
}

# ── CENTER — Username ─────────────────────────────────────
label {
  monitor =
  text =   $USER @ zenith
  color = $muted
  font_size = 11
  font_family = JetBrainsMono Nerd Font
  position = 0, 34
  halign = center
  valign = center
}

# ── CENTER — Password field ───────────────────────────────
input-field {
  monitor =
  size = 460, 52
  outline_thickness = 1
  dots_size = 0.26
  dots_spacing = 0.18
  dots_center = true
  dots_rounding = -1
  outer_color = $border
  inner_color = $surface
  font_color = $text
  fade_on_empty = true
  fade_timeout = 1200
  placeholder_text =  enter password
  hide_input = false
  rounding = -1
  check_color = $accent
  fail_color = $critical
  fail_text = wrong password
  capslock_color = rgb(240, 180, 60)
  numlock_color = $accent
  bothlock_color = $critical
  invert_numlock = false
  position = 0, -24
  halign = center
  valign = center
}

# ── CENTER BELOW — Now Playing (collapses when nothing) ───
label {
  monitor =
  text = cmd[update:2000] $HOME/.config/zenith/scripts/lock-status.sh media
  color = $muted
  font_size = 11
  font_family = JetBrainsMono Nerd Font Italic
  position = 0, -100
  halign = center
  valign = center
}

# ══════════════════════════════════════════════════════════
#  POWER POPUP — Windows-style (press button → options pop)
# ══════════════════════════════════════════════════════════

# Power button (always visible, bottom-right)
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label power
  color = $text
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  position = -36, 36
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh toggle
}

# Suspend action (appears above power button when open)
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label suspend
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = -36, 92
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh action suspend
}

# Reboot action
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label reboot
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = -36, 124
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh action reboot
}

# Shutdown action
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label shutdown
  color = $text
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = -36, 156
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh action shutdown
}

# Cancel action
label {
  monitor =
  text = cmd[update:0:1] $HOME/.config/zenith/scripts/lock-power.sh label cancel
  color = $muted
  font_size = 11
  font_family = JetBrainsMono Nerd Font
  position = -36, 72
  halign = right
  valign = bottom
  onclick = $HOME/.config/zenith/scripts/lock-power.sh cancel
}
