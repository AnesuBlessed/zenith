# ╔══════════════════════════════════════════════════════════╗
# ║   ZENITH — Hyprlock Lock Screen (mock-exact layout)      ║
# ║   Zenith Display for clock/date/temp/condition; status    ║
# ║   text in JetBrainsMono Nerd Font; on-click power pill.   ║
# ╚══════════════════════════════════════════════════════════╝

# >>> ZENITH PALETTE
$accent   = rgb(165, 216, 200)
$base     = rgb(18, 18, 23)
$surface  = rgba(26, 30, 37, 0.72)
$border   = rgba(72, 70, 79, 0.35)
$text     = rgb(228, 235, 245)
$muted    = rgb(154, 167, 184)
$critical = rgb(240, 90, 90)
# <<< ZENITH PALETTE

# ── Animations ───────────────────────────────────────────
animations {
  enabled = true
  bezier = zenith, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 4, zenith
  animation = inputFieldDots, 1, 2, zenith
}

# ── Background — blurred current wallpaper ───────────────
background {
  monitor =
  path = $HOME/.cache/zenith/wall.lock.png
  blur_passes = 2
  blur_size = 8
  brightness = 0.62
  contrast = 0.9
  vibrancy = 0.1
  vibrancy_darkness = 0.0
}

# ── TOP LEFT — Weather cluster ───────────────────────────
# Nerd glyph small, big temp, condition to its right, H/L line below temp
label {
  monitor =
  text = cmd[update:600000] $HOME/.config/zenith/scripts/lock-status.sh wicon
  color = $accent
  font_size = 24
  font_family = JetBrainsMono Nerd Font
  position = 40, 30
  halign = left
  valign = top
}

# Big temperature in Zenith Display
label {
  monitor =
  text = cmd[update:600000] $HOME/.config/zenith/scripts/lock-status.sh temp
  color = $text
  font_size = 52
  font_family = Zenith Display
  position = 80, 20
  halign = left
  valign = top
}

# Condition line ("Partly cloudy") — same row as the temperature
label {
  monitor =
  text = cmd[update:600000] $HOME/.config/zenith/scripts/lock-status.sh condition
  color = $text
  font_size = 15
  font_family = Zenith Display
  position = 180, 44
  halign = left
  valign = top
}

# "H 6°C  L 3°C · feels TC" — below the temperature
label {
  monitor =
  text = cmd[update:600000] $HOME/.config/zenith/scripts/lock-status.sh hilo
  color = $muted
  font_size = 12
  font_family = Zenith Display
  position = 80, 84
  halign = left
  valign = top
}

# ── TOP RIGHT — Bluetooth chip ───────────────────────────
shape {
  monitor =
  size = 200, 36
  color = $surface
  rounding = -1
  border_size = 0
  position = -244, 30
  halign = right
  valign = top
}
label {
  monitor =
  text = cmd[update:30000] 󰂖 $HOME/.config/zenith/scripts/lock-status.sh bt
  color = $text
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  position = -244, 30
  halign = right
  valign = top
}

# ── TOP RIGHT — WiFi chip ────────────────────────────────
shape {
  monitor =
  size = 150, 36
  color = $surface
  rounding = -1
  border_size = 0
  position = -44, 30
  halign = right
  valign = top
}
label {
  monitor =
  text = cmd[update:30000] 󰤨 $HOME/.config/zenith/scripts/lock-status.sh ssid
  color = $text
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  position = -44, 30
  halign = right
  valign = top
}

# ── CENTER — Huge two-tone clock ─────────────────────────
# "12" near-white, ":06" mint (Pango markup from lock-clock.sh)
label {
  monitor =
  text = cmd[update:10000] $HOME/.config/zenith/scripts/lock-clock.sh
  color = $text
  font_size = 130
  font_family = Zenith Display
  position = 0, -30
  halign = center
  valign = center
}

# ── CENTER — Date ────────────────────────────────────────
label {
  monitor =
  text = cmd[update:60000] date '+%A, %-d %B'
  color = $text
  font_size = 28
  font_family = Zenith Display
  position = 0, 55
  halign = center
  valign = center
}

# ── CENTER — Greeting pill ───────────────────────────────
shape {
  monitor =
  size = 250, 34
  color = $surface
  rounding = -1
  border_size = 0
  position = 0, 110
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:60000] $HOME/.config/zenith/scripts/lock-status.sh greeting
  color = $muted
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  position = 0, 110
  halign = center
  valign = center
}

# ── CENTER — Password pill ───────────────────────────────
input-field {
  monitor =
  size = 460, 54
  outline_thickness = 1
  dots_size = 0.24
  dots_spacing = 0.2
  dots_center = true
  dots_rounding = -1
  outer_color = $border
  inner_color = rgba(16, 19, 24, 0.62)
  font_color = $text
  fade_on_empty = false
  fade_timeout = 0
  placeholder_text = Enter your password
  hide_input = false
  rounding = -1
  check_color = $accent
  fail_color = $critical
  fail_text = wrong password
  capslock_color = rgb(240, 180, 60)
  numlock_color = $accent
  bothlock_color = $critical
  invert_numlock = false
  position = 0, 180
  halign = center
  valign = center
}

# Lock glyph inside the pill (left)
label {
  monitor =
  text = 󰌾
  color = $muted
  font_size = 14
  font_family = JetBrainsMono Nerd Font
  position = -202, 180
  halign = center
  valign = center
}

# Arrow accent (right of the pill, like the mock's submit button)
shape {
  monitor =
  size = 44, 44
  color = rgba(165, 216, 200, 0.16)
  rounding = -1
  border_size = 0
  position = 252, 180
  halign = center
  valign = center
}
label {
  monitor =
  text = 󰌁
  color = $accent
  font_size = 16
  font_family = JetBrainsMono Nerd Font
  position = 252, 180
  halign = center
  valign = center
}

# ── BOTTOM RIGHT — Control pill (all clickable) ──────────
shape {
  monitor =
  size = 270, 72
  color = rgba(16, 19, 24, 0.72)
  rounding = -1
  border_size = 0
  position = -40, -40
  halign = right
  valign = bottom
}

# Session / layout
label {
  monitor =
  text = 󰗽
  color = $text
  font_size = 22
  font_family = JetBrainsMono Nerd Font
  position = -240, -40
  halign = center
  valign = bottom
  on-click = hyprctl dispatch exit
}

# Power off
label {
  monitor =
  text = 󰐥
  color = $text
  font_size = 22
  font_family = JetBrainsMono Nerd Font
  position = -180, -40
  halign = center
  valign = bottom
  on-click = systemctl poweroff
}

# Sleep (suspend)
label {
  monitor =
  text = 󰖔
  color = $text
  font_size = 22
  font_family = JetBrainsMono Nerd Font
  position = -120, -40
  halign = center
  valign = bottom
  on-click = systemctl suspend
}

# Reboot / refresh
label {
  monitor =
  text = 󰜉
  color = $text
  font_size = 22
  font_family = JetBrainsMono Nerd Font
  position = -60, -40
  halign = center
  valign = bottom
  on-click = systemctl reboot
}
