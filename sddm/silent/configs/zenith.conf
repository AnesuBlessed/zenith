; Zenith — SilentSDDM config (rei-based, Zenith Display font, Zenith palette)
; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = rei.png
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "rei.mp4"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "center"
align = "center"
format = "HH:mm"
font-family = "Zenith Display"
font-size = 128
font-weight = 700
color = "#E4EBF5"

[LockScreen.Date]
display = true
format = "dddd, MMMM d"
locale = "en_US"
font-family = "Zenith Display"
font-size = 24
font-weight = 600
color = "#9AA7B8"
margin-top = -15

[LockScreen.Message]
display = false

[LoginScreen]
background = "rei.mp4"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "left"
margin = 50

[LoginScreen.LoginArea.Avatar]
shape = "square"
border-radius = 30
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 3
inactive-border-size = 3
active-border-color = "#59B9E8"
inactive-border-color = "#59B9E8"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "Zenith Display"
font-size = 16
font-weight = 700
color = "#E4EBF5"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = false
font-family = "Zenith Display"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#E4EBF5"
background-color = "#0A0C12"
background-opacity = 0.55
border-size = 2
border-color = "#59B9E8"
border-radius-left = 15
border-radius-right = 15
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#59B9E8"
background-opacity = 0.0
active-background-color = "#59B9E8"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#59B9E8"
active-content-color = "#0A0C12"
border-size = 2
border-color = "#59B9E8"
border-radius-left = 15
border-radius-right = 15
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = true
font-family = "Zenith Display"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Zenith Display"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#E4EBF5"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Zenith Display"
font-size = 11
font-weight = 400
normal-color = "#9AA7B8"
warning-color = "#F0B43C"
error-color = "#F05A5A"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 100
margin-left = 100
size = 30
border-radius = 15
spacing = 10
font-family = "Zenith Display"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = false
margin = 5
background-color = "#0A0C12"
background-opacity = 0.92
active-option-background-color = "#59B9E8"
active-option-background-opacity = 1.0
content-color = "#E4EBF5"
active-content-color = "#0A0C12"
font-family = "Zenith Display"
border-size = 1
border-color = "#59B9E8"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 4
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 100
popup-width = 200
background-color = "#59B9E8"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#E4EBF5"
active-content-color = "#0A0C12"
border-size = 0
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-left"
index = 3
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#59B9E8"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#E4EBF5"
active-content-color = "#0A0C12"
border-size = 0
font-size = 11
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-left"
index = 2
background-color = "#59B9E8"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#E4EBF5"
active-content-color = "#0A0C12"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-left"
index = 1
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#59B9E8"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#E4EBF5"
active-content-color = "#0A0C12"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#0A0C12"
background-opacity = 1.0
key-content-color = "#E4EBF5"
key-color = "#0A0C12"
key-opacity = 1.0
key-active-background-color = "#59B9E8"
key-active-opacity = 1.0
selection-background-color = "#1A2330"
selection-content-color = "#E4EBF5"
primary-color = "#59B9E8"
border-size = 1
border-color = "#59B9E8"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Zenith Display"
font-size = 11
content-color = "#E4EBF5"
background-color = "#0A0C12"
background-opacity = 0.95
border-radius = 15
disable-user = false
disable-login-button = false
